<!doctype html>
<!-- Goalkeeper-in-shell test harness (dev server only: /tests/gk-shell.html). Mounts the real dashboard
     with the goalkeeper launcher, exactly as main.ts would. Used by the Playwright specs in tests/e2e.
     Query flags (passed through to startGoalkeeper(ctx, { auto, debug })):
       ?debug         open the keeper debug panel
       ?auto=mouse    skip the start screen and play with the mouse
       ?auto=camera   skip the start screen and start the camera path (calibration)
     Exposes window.__shell (the Shell) and window.__events (every 'motion-event' detail, in order). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Keeper shell harness</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;800&display=swap" />
  </head>
  <body>
    <script type="module">
      import '/src/style.css'
      import { mountShell } from '/src/shell/index.ts'
      import { startGoalkeeper } from '/src/sports/goalkeeper/index.ts'
      const params = new URLSearchParams(location.search)
      const debug = params.has('debug')
      const autoParam = params.get('auto')
      const auto = autoParam === 'mouse' || autoParam === 'camera' ? autoParam : undefined
      window.__events = []
      window.addEventListener('motion-event', (e) => window.__events.push(e.detail))
      window.__shell = mountShell({ launchers: { goalkeeper: (ctx) => startGoalkeeper(ctx, { auto, debug }) } })
    </script>
  </body>
</html>
