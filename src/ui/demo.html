<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic Ring · UI demo</title>
    <style>
      /* Fake "game canvas" so the overlays have something to sit on. */
      #stage {
        background:
          radial-gradient(ellipse at 50% 35%, rgba(34, 229, 255, 0.16), transparent 45%),
          radial-gradient(ellipse at 50% 110%, rgba(255, 46, 136, 0.3), transparent 55%),
          linear-gradient(#0d1430, #070a1a);
      }
      #stage::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 46%;
        width: 22vh;
        height: 34vh;
        translate: -50% -50%;
        border-radius: 40% 40% 18% 18%;
        border: 2px solid rgba(255, 46, 136, 0.35);
        box-shadow: 0 0 40px rgba(255, 46, 136, 0.25), inset 0 0 40px rgba(255, 46, 136, 0.15);
      }
      /* Control bar sits on the right edge so it never covers HUD elements. */
      #demo-bar {
        position: fixed;
        right: 10px;
        top: 50%;
        translate: 0 -50%;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 8px 10px;
        background: rgba(11, 16, 38, 0.92);
        border: 1px solid #1b2556;
        font: 600 13px/1 'Chakra Petch', system-ui, sans-serif;
      }
      #demo-bar button {
        padding: 7px 11px;
        border: 1px solid #22e5ff;
        background: transparent;
        color: #22e5ff;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font: inherit;
      }
      #demo-bar button:hover { background: rgba(34, 229, 255, 0.15); }
      #demo-bar button.on { background: #22e5ff; color: #0b1026; }
      #demo-bar .sep { height: 1px; background: #1b2556; margin: 4px 0; }
      #demo-bar .sub { border-color: #ff2e88; color: #ff2e88; }
      #demo-bar .sub:hover { background: rgba(255, 46, 136, 0.15); }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;800&display=swap" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <div id="demo-bar"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
