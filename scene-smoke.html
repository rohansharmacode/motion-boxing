<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { createKeeperScene } from '/src/sports/goalkeeper/scene.ts'
const cv = document.getElementById('c')
const s = createKeeperScene(cv)
s.resize(innerWidth, innerHeight)
const q = new URLSearchParams(location.search)
const freeze = q.get('t') ? parseFloat(q.get('t')) : null
let t = 0
const cycle = 4.0
function step(dtMs){
  t += dtMs/1000
  const c = t % cycle
  const tell = { side: -1, high: true }
  let phase='idle', prog=0
  if (c < 0.5) { phase='idle'; prog=c/0.5 }
  else if (c < 1.5) { phase='runup'; prog=c-0.5 }
  else if (c < 2.0) { phase='telegraph'; prog=(c-1.5)/0.5 }
  else if (c < 2.15) { phase='kick'; prog=(c-2.0)/0.15 }
  else { phase='recover'; prog=Math.min(1,(c-2.15)/1.0) }
  s.setStriker(phase, prog, tell)
  const fl = c - 2.1
  if (fl >= 0 && fl < 0.8) {
    const u = fl/0.8
    s.setBall({ x: -2.6*u, y: 0.11 + 2.0*u - 0.2*u*u, z: -11 + 11*u }, { x: 5, y: 20, z: 0 }, true)
  } else if (c < 2.1) s.setBall({ x:0, y:0.11, z:-11 }, {x:0,y:0,z:0}, true)
  else s.setBall({x:0,y:0.11,z:-11},{x:0,y:0,z:0},false)
  if (fl >= 0.78 && fl - dtMs/1000 < 0.78) { s.flashSave({x:-2.5,y:1.9,z:0}, 'left', 0.8); s.highlightZone(0,'save') }
  const gx = -0.6 - 1.8*Math.max(0,Math.min(1,(c-1.9)/0.8))
  s.setKeeper({ left:{x:gx,y:1.3+0.6*Math.max(0,Math.min(1,(c-1.9)/0.8)),z:0}, right:{x:0.7,y:1.25,z:0}, torsoTop:{x:-0.2,y:1.6,z:0}, torsoBottom:{x:0,y:0.95,z:0}, tracked:true })
  s.update(dtMs); s.render()
}
if (freeze !== null) { const n = Math.round(freeze*60); for (let i=0;i<n;i++) step(1000/60); if (q.get('goal')) { s.flashGoal({x:2,y:1.5,z:0}); s.highlightZone(5,'goal'); for(let i=0;i<10;i++) step(16) } }
else { let last=performance.now(); const loop=(now)=>{ step(Math.min(50,now-last)); last=now; requestAnimationFrame(loop)}; requestAnimationFrame(loop) }
window.__s = s
</script></body></html>
