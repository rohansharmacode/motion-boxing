<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Defeated round over title card">
  <defs>
    <linearGradient id="ls-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="55%" stop-color="#FF7A2F" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="ls-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    .glitch { animation: ls-jitter 2.6s steps(2) infinite; }
    .pulse { animation: ls-pulse 1.8s ease-in-out infinite; }
    @keyframes ls-jitter { 0%,88%,100% { transform: translateX(0); } 92% { transform: translateX(-4px); } 96% { transform: translateX(4px); } }
    @keyframes ls-pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .glitch, .pulse { animation: none; } }
  </style>

  <polygon points="74,36 746,36 726,244 54,244" fill="#140A1A" fill-opacity="0.94" stroke="#FF2A85" stroke-width="3" />
  <!-- Scanline glitch bars -->
  <rect x="92" y="102" width="120" height="4" fill="#FF2A85" fill-opacity="0.45" />
  <rect x="598" y="168" width="110" height="4" fill="#FFB800" fill-opacity="0.45" />

  <g class="glitch" filter="url(#ls-glow)">
    <text x="400" y="84" text-anchor="middle" fill="#FFB800" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="4">GUARD BROKEN · SYSTEM RESET</text>
    <text x="400" y="168" text-anchor="middle" fill="url(#ls-fill)" font-family="'Chakra Petch', sans-serif" font-size="96" font-weight="700" font-style="italic" letter-spacing="5">DEFEATED</text>
    <rect x="230" y="186" width="340" height="4" rx="2" fill="#FF2A85" />
  </g>
  <text class="pulse" x="400" y="218" text-anchor="middle" fill="#B6C2E2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="3">CHECK AI COACH TIPS · STEP BACK IN</text>
</svg>
