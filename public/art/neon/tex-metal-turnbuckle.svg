<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Seamless brushed metal turnbuckle texture with neon accents">
  <defs>
    <!-- Horizontal brushed metallic gradient (identical at x=0 and x=512 -> seamless) -->
    <linearGradient id="mt-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141B30" />
      <stop offset="25%" stop-color="#222E4D" />
      <stop offset="50%" stop-color="#11172A" />
      <stop offset="75%" stop-color="#263354" />
      <stop offset="100%" stop-color="#141B30" />
    </linearGradient>
    <!-- 16x16 industrial diamond knurling pattern (divides 512 evenly) -->
    <pattern id="mt-knurl" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0 L16,8 L8,16 Z" fill="none" stroke="#080C1C" stroke-width="1.6" />
      <path d="M0,8 L8,0 L16,8" fill="none" stroke="#6E84B8" stroke-opacity="0.16" stroke-width="1" />
    </pattern>
    <!-- 64x32 horizontal brushed hairlines -->
    <pattern id="mt-brush" width="64" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="64" y2="6" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <line x1="0" y1="15" x2="64" y2="15" stroke="#000000" stroke-opacity="0.22" stroke-width="1" />
      <line x1="0" y1="24" x2="64" y2="24" stroke="#22E5FF" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <filter id="mt-glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Metallic Base + Brushed Grain -->
  <rect width="512" height="512" fill="url(#mt-sheen)" />
  <rect width="512" height="512" fill="url(#mt-brush)" />

  <!-- Knurled Grip Bands (Middle & Wrapped Top/Bottom) -->
  <rect x="0" y="0" width="512" height="80" fill="url(#mt-knurl)" />
  <rect x="0" y="432" width="512" height="80" fill="url(#mt-knurl)" />
  <rect x="0" y="192" width="512" height="128" fill="url(#mt-knurl)" />

  <!-- Recessed Machined Collar Channels -->
  <rect x="0" y="80" width="512" height="14" fill="#070A16" />
  <rect x="0" y="178" width="512" height="14" fill="#070A16" />
  <rect x="0" y="320" width="512" height="14" fill="#070A16" />
  <rect x="0" y="418" width="512" height="14" fill="#070A16" />

  <!-- Glowing Cyan & Hot-Pink Recessed Neon Trim Strips -->
  <g filter="url(#mt-glow)">
    <rect x="0" y="128" width="512" height="10" fill="#22E5FF" />
    <rect x="0" y="131" width="512" height="3" fill="#F2F7FF" />
    <rect x="0" y="374" width="512" height="10" fill="#FF2E88" />
    <rect x="0" y="377" width="512" height="3" fill="#F2F7FF" />
  </g>

  <!-- Seamless Evenly Spaced Machined Hex Bolts (64, 192, 320, 448) -->
  <g fill="#1E2845" stroke="#070A16" stroke-width="2">
    <circle cx="64" cy="108" r="7" /><circle cx="192" cy="108" r="7" /><circle cx="320" cy="108" r="7" /><circle cx="448" cy="108" r="7" />
    <circle cx="64" cy="158" r="7" /><circle cx="192" cy="158" r="7" /><circle cx="320" cy="158" r="7" /><circle cx="448" cy="158" r="7" />
    <circle cx="64" cy="354" r="7" /><circle cx="192" cy="354" r="7" /><circle cx="320" cy="354" r="7" /><circle cx="448" cy="354" r="7" />
    <circle cx="64" cy="402" r="7" /><circle cx="192" cy="402" r="7" /><circle cx="320" cy="402" r="7" /><circle cx="448" cy="402" r="7" />
  </g>
</svg>
