<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="KINETIC K neon app icon">
  <defs>
    <linearGradient id="ka-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060916" />
      <stop offset="55%" stop-color="#0E1534" />
      <stop offset="100%" stop-color="#1E0D2E" />
    </linearGradient>
    <linearGradient id="ka-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22E5FF" />
      <stop offset="52%" stop-color="#F2F7FF" />
      <stop offset="100%" stop-color="#FF2E88" />
    </linearGradient>
    <radialGradient id="ka-glow-bg" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#FF2E88" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#22E5FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#080C1C" stop-opacity="0" />
    </radialGradient>
    <pattern id="ka-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 L0,64" fill="none" stroke="#22E5FF" stroke-opacity="0.08" stroke-width="2" />
    </pattern>
    <filter id="ka-neon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="ka-tile"><rect x="32" y="32" width="960" height="960" rx="220" /></clipPath>
  </defs>

  <!-- Rounded App Icon Tile (Transparent Outer Corners) -->
  <g clip-path="url(#ka-tile)">
    <rect x="32" y="32" width="960" height="960" fill="url(#ka-bg)" />
    <rect x="32" y="32" width="960" height="960" fill="url(#ka-grid)" />
    <rect x="32" y="32" width="960" height="960" fill="url(#ka-glow-bg)" />
  </g>
  <rect x="36" y="36" width="952" height="952" rx="216" fill="none" stroke="url(#ka-ring)" stroke-opacity="0.65" stroke-width="10" />

  <!-- Glowing Octagonal Kinetic Ring Frame -->
  <g filter="url(#ka-neon)">
    <polygon
      points="318,124 706,124 900,318 900,706 706,900 318,900 124,706 124,318"
      fill="#080C1C"
      fill-opacity="0.72"
      stroke="url(#ka-ring)"
      stroke-width="22"
      stroke-linejoin="round"
    />
    <polygon
      points="342,172 682,172 852,342 852,682 682,852 342,852 172,682 172,342"
      fill="none"
      stroke="#22E5FF"
      stroke-opacity="0.35"
      stroke-width="6"
    />

    <!-- Stylized Geometric Neon "K" (Cyan Vertical Pillar + Hot-Pink Strike Chevrons) -->
    <!-- Vertical Beam -->
    <polygon points="318,266 432,266 392,758 278,758" fill="#22E5FF" stroke="#F2F7FF" stroke-width="8" stroke-linejoin="round" />
    <!-- Upper & Lower Kinetic Strike Arms -->
    <polygon points="444,512 634,266 764,266 562,512 738,758 606,758" fill="#FF2E88" stroke="#F2F7FF" stroke-width="8" stroke-linejoin="round" />
    <!-- Core Impact Diamond -->
    <polygon points="446,448 504,512 446,576 388,512" fill="#F2F7FF" />
  </g>
</svg>
