      <path d="M460,14 H484 L466,114 H442 Z" />
      <!-- C -->
      <path d="M518,14 H580 L576,34 H526 L516,94 H566 L562,114 H500 C488,114 484,106 486,94 L496,34 C498,22 506,14 518,14 Z" />
