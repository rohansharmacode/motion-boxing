      <line x1="10" y1="54" x2="28" y2="54" stroke="#22E5FF" />
      <line x1="636" y1="90" x2="668" y2="90" stroke="#22E5FF" />
    </g>

    <!-- Hot-Pink Neon Drop Extrusion Layer -->
    <g transform="translate(5, 5)" fill="#FF2E88" fill-opacity="0.55">
