<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-label="KINETIC neon synthwave wordmark">
  <defs>
    <linearGradient id="lk-chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="44%" stop-color="#22E5FF" />
      <stop offset="52%" stop-color="#0B1638" />
      <stop offset="62%" stop-color="#FF2E88" />
      <stop offset="100%" stop-color="#FF9AD0" />
    </linearGradient>
    <linearGradient id="lk-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22E5FF" />
      <stop offset="55%" stop-color="#F2F7FF" />
      <stop offset="100%" stop-color="#FF2E88" />
    </linearGradient>
    <filter id="lk-glow" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="4.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Pure Vector Slanted Retro-Arcade "KINETIC" Wordmark (Font-Independent) -->
  <g transform="translate(26, 20)" filter="url(#lk-glow)">
