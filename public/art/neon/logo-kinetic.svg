      <!-- E -->
      <path d="M294,14 H362 L358,34 H314 L310,54 H348 L344,74 H306 L302,94 H348 L344,114 H276 Z" />
      <!-- T -->
      <path d="M372,14 H448 L444,34 H418 L404,114 H380 L394,34 H368 Z" />
      <!-- I -->
      <path d="M460,14 H484 L466,114 H442 Z" />
      <!-- C -->
