    </g>

    <!-- Main Chrome-Cyan-Pink Synthwave Letterforms -->
    <g fill="url(#lk-chrome)" stroke="#22E5FF" stroke-width="2.2" stroke-linejoin="round">
      <!-- K -->
      <path d="M56,14 H80 L72,54 L108,14 H136 L94,60 L124,114 H96 L74,72 L68,78 L62,114 H38 Z" />
      <!-- I -->
      <path d="M150,14 H174 L156,114 H132 Z" />
      <!-- N -->
      <path d="M192,14 H216 L242,74 L252,14 H276 L258,114 H234 L208,54 L198,114 H174 Z" />
