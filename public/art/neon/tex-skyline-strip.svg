<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" width="1024" height="256" role="img" aria-label="Seamless synthwave neon city skyline strip">
  <defs>
    <linearGradient id="sk-haze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2E88" stop-opacity="0" />
      <stop offset="70%" stop-color="#FF2E88" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#22E5FF" stop-opacity="0.28" />
    </linearGradient>
    <filter id="sk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Transparent upper sky + soft neon horizon glow near bottom -->
  <rect x="0" y="130" width="1024" height="126" fill="url(#sk-haze)" />

  <!-- Back Tower Layer (Deep Midnight Navy, seamless at y=184 on x=0 and x=1024) -->
  <path
    d="M0,184 L0,148 L36,148 L36,96 L88,96 L88,156 L132,156 L132,72 L182,72 L182,138 L224,138 L224,104 L286,104 L286,162 L338,162 L338,54 L366,54 L366,34 L372,34 L372,54 L404,54 L404,142 L454,142 L454,88 L522,88 L522,152 L572,152 L572,66 L632,66 L632,140 L680,140 L680,98 L748,98 L748,158 L792,158 L792,48 L820,48 L820,24 L826,24 L826,48 L858,48 L858,136 L912,136 L912,86 L976,86 L976,148 L1024,148 L1024,256 L0,256 Z"
    fill="#0E1534"
  />

  <!-- Front Tower Layer (Dark Navy, seamless edge height y=198 on x=0 and x=1024) -->
  <path
    d="M0,198 L0,164 L54,164 L54,124 L118,124 L118,180 L166,180 L166,108 L244,108 L244,174 L298,174 L298,132 L354,132 L354,186 L418,186 L418,92 L488,92 L488,172 L542,172 L542,120 L612,120 L612,182 L662,182 L662,110 L734,110 L734,174 L782,174 L782,130 L846,130 L846,184 L902,184 L902,116 L974,116 L974,164 L1024,164 L1024,256 L0,256 Z"
    fill="#070B1A"
  />

  <!-- Glowing Synthwave Rooftop Trim Bars -->
  <g filter="url(#sk-glow)" stroke-width="2.5">
    <line x1="54" y1="124" x2="118" y2="124" stroke="#22E5FF" />
    <line x1="166" y1="108" x2="244" y2="108" stroke="#FF2E88" />
    <line x1="418" y1="92" x2="488" y2="92" stroke="#22E5FF" />
    <line x1="542" y1="120" x2="612" y2="120" stroke="#FF2E88" />
    <line x1="662" y1="110" x2="734" y2="110" stroke="#22E5FF" />
    <line x1="902" y1="116" x2="974" y2="116" stroke="#FF2E88" />
  </g>

  <!-- Crisp Pixel Window Grids -->
  <g fill="#22E5FF" fill-opacity="0.72">
    <rect x="66" y="138" width="12" height="5" /><rect x="86" y="138" width="18" height="5" />
    <rect x="66" y="152" width="38" height="4" /><rect x="66" y="168" width="22" height="4" />
    <rect x="430" y="108" width="18" height="5" /><rect x="456" y="108" width="18" height="5" />
    <rect x="430" y="124" width="44" height="5" /><rect x="430" y="142" width="18" height="5" />
    <rect x="456" y="160" width="18" height="5" /><rect x="676" y="126" width="44" height="5" />
    <rect x="676" y="142" width="18" height="5" /><rect x="702" y="158" width="18" height="5" />
    <rect x="796" y="146" width="36" height="4" /><rect x="796" y="162" width="20" height="4" />
  </g>
  <g fill="#FF2E88" fill-opacity="0.78">
    <rect x="178" y="124" width="24" height="5" /><rect x="210" y="124" width="20" height="5" />
    <rect x="178" y="142" width="52" height="4" /><rect x="178" y="160" width="28" height="4" />
    <rect x="310" y="148" width="32" height="4" /><rect x="556" y="136" width="42" height="5" />
    <rect x="556" y="154" width="18" height="5" /><rect x="582" y="170" width="18" height="5" />
    <rect x="916" y="132" width="44" height="5" /><rect x="916" y="150" width="20" height="5" />
    <rect x="942" y="168" width="18" height="5" />
  </g>

  <!-- Seamless Bottom Neon Horizon Line -->
  <rect x="0" y="252" width="1024" height="4" fill="#22E5FF" fill-opacity="0.85" />
</svg>
