<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Knockout KO HUD icon">
  <defs>
    <linearGradient id="ik-burst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E88" />
      <stop offset="100%" stop-color="#22E5FF" />
    </linearGradient>
    <filter id="ik-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g filter="url(#ik-glow)">
    <!-- Explosive Retro-Arcade Impact Starburst -->
    <polygon
      points="64,6 77,28 104,16 97,43 122,56 101,74 116,100 88,96 76,122 58,101 30,114 34,86 8,74 28,56 14,28 42,32"
      fill="#080C1C"
      fill-opacity="0.94"
      stroke="url(#ik-burst)"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <!-- Pure Vector KO Glyphs (Font-Independent!) -->
    <!-- K -->
    <g stroke="#22E5FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="34" y1="44" x2="34" y2="84" />
      <polyline points="56,44 36,64 58,84" />
    </g>
    <g stroke="#F2F7FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="34" y1="44" x2="34" y2="84" />
      <polyline points="56,44 36,64 58,84" />
    </g>
    <!-- O -->
    <rect x="68" y="45" width="26" height="38" rx="11" fill="none" stroke="#FF2E88" stroke-width="8" />
    <rect x="68" y="45" width="26" height="38" rx="11" fill="none" stroke="#F2F7FF" stroke-width="2.5" />
  </g>
</svg>
