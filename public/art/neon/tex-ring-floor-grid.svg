<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Seamless synthwave neon ring floor grid texture">
  <defs>
    <filter id="fg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <!-- 64x64 sub-grid divides 512 evenly -->
    <pattern id="fg-sub" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 L0,64" fill="none" stroke="#FF2E88" stroke-opacity="0.22" stroke-width="1.2" />
      <circle cx="32" cy="32" r="1.4" fill="#22E5FF" fill-opacity="0.22" />
    </pattern>
  </defs>

  <!-- Deep Navy Floor Base -->
  <rect width="512" height="512" fill="#070B1A" />
  <rect width="512" height="512" fill="url(#fg-sub)" />

  <!-- Major Glowing Cyan Laser Lines (split at 0 & 512 so edges join cleanly) -->
  <g filter="url(#fg-glow)">
    <!-- Soft outer glow -->
    <g stroke="#22E5FF" stroke-opacity="0.45" stroke-width="7">
      <line x1="0" y1="256" x2="512" y2="256" />
      <line x1="256" y1="0" x2="256" y2="512" />
      <line x1="0" y1="0" x2="512" y2="0" />
      <line x1="0" y1="512" x2="512" y2="512" />
      <line x1="0" y1="0" x2="0" y2="512" />
      <line x1="512" y1="0" x2="512" y2="512" />
    </g>
    <!-- Crisp bright tube core -->
    <g stroke="#22E5FF" stroke-width="2.5">
      <line x1="0" y1="256" x2="512" y2="256" />
      <line x1="256" y1="0" x2="256" y2="512" />
      <line x1="0" y1="0" x2="512" y2="0" />
      <line x1="0" y1="512" x2="512" y2="512" />
      <line x1="0" y1="0" x2="0" y2="512" />
      <line x1="512" y1="0" x2="512" y2="512" />
    </g>
    <!-- White inner filament -->
    <g stroke="#F2F7FF" stroke-opacity="0.85" stroke-width="1">
      <line x1="0" y1="256" x2="512" y2="256" />
      <line x1="256" y1="0" x2="256" y2="512" />
    </g>
  </g>

  <!-- Hot-Pink Secondary Mid-Cell Accent Crosses (128, 384) -->
  <g stroke="#FF2E88" stroke-opacity="0.52" stroke-width="2">
    <line x1="128" y1="0" x2="128" y2="512" stroke-dasharray="10 10" />
    <line x1="384" y1="0" x2="384" y2="512" stroke-dasharray="10 10" />
    <line x1="0" y1="128" x2="512" y2="128" stroke-dasharray="10 10" />
    <line x1="0" y1="384" x2="512" y2="384" stroke-dasharray="10 10" />
  </g>

  <!-- Seamless Wrapped Intersection Nodes (Center + 4 Corners + 4 Edge Midpoints) -->
  <g fill="#FF2E88" stroke="#F2F7FF" stroke-width="1.5">
    <polygon points="256,246 266,256 256,266 246,256" />
    <polygon points="0,-10 10,0 0,10 -10,0" />
    <polygon points="512,-10 522,0 512,10 502,0" />
    <polygon points="0,502 10,512 0,522 -10,512" />
    <polygon points="512,502 522,512 512,522 502,512" />
    <polygon points="256,-8 264,0 256,8 248,0" fill="#22E5FF" />
    <polygon points="256,504 264,512 256,520 248,512" fill="#22E5FF" />
    <polygon points="-8,256 0,248 8,256 0,264" fill="#22E5FF" />
    <polygon points="504,256 512,248 520,256 512,264" fill="#22E5FF" />
  </g>
</svg>
