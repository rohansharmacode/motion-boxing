<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Webcam calibration ready-stance silhouette guide">
  <defs>
    <filter id="cal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    .pulse { animation: cal-pulse 2s ease-in-out infinite; }
    .scan-line { animation: cal-scan 2.6s ease-in-out infinite; }
    @keyframes cal-pulse { 0%,100% { stroke-opacity: 0.55; } 50% { stroke-opacity: 1; } }
    @keyframes cal-scan { 0%,100% { transform: translateY(0px); opacity: 0.25; } 50% { transform: translateY(230px); opacity: 0.75; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .scan-line { animation: none; } }
  </style>

  <!-- Transparent overlay: outer framing brackets -->
  <g stroke="#00F0FF" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#cal-glow)">
    <path d="M 36 86 L 36 36 L 86 36" />
    <path d="M 604 86 L 604 36 L 554 36" />
    <path d="M 36 394 L 36 444 L 86 444" />
    <path d="M 604 394 L 604 444 L 554 444" />
  </g>

  <!-- Subtle Horizontal Scan Bar -->
  <line class="scan-line" x1="90" y1="90" x2="550" y2="90" stroke="#C8FF00" stroke-width="2" stroke-dasharray="10 8" />

  <!-- Shoulder Alignment Guide Line -->
  <line x1="120" y1="262" x2="520" y2="262" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 6" />
  <text x="530" y="266" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SHOULDERS</text>

  <!-- Center Vertical Symmetry Axis -->
  <line x1="320" y1="68" x2="320" y2="438" stroke="#00F0FF" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Geometric Upper-Body Ready-Stance Outline (Seated or Standing) -->
  <g class="pulse" fill="none" stroke="#00F0FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#cal-glow)">
    <!-- Head guide octagon -->
    <polygon points="292,98 348,98 370,126 362,178 338,202 302,202 278,178 270,126" stroke-dasharray="10 7" />
    <!-- Neck & Shoulders & Torso trapezoid -->
    <path d="M 300 206 L 296 232 L 194 260 L 170 356 L 210 444" stroke-dasharray="12 7" />
    <path d="M 340 206 L 344 232 L 446 260 L 470 356 L 430 444" stroke-dasharray="12 7" />
    <!-- Shoulder landmark anchors (MediaPipe 11 & 12) -->
    <circle cx="204" cy="262" r="7" fill="#00F0FF" stroke="none" />
    <circle cx="436" cy="262" r="7" fill="#00F0FF" stroke="none" />
  </g>

  <!-- Raised Guard Fist Target Zones (MediaPipe 15 & 16) -->
  <g filter="url(#cal-glow)">
    <g transform="translate(226, 224)">
      <circle cx="0" cy="0" r="34" fill="rgba(200,255,0,0.12)" stroke="#C8FF00" stroke-width="3" stroke-dasharray="8 5" />
      <text x="0" y="5" text-anchor="middle" fill="#C8FF00" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">L FIST</text>
    </g>
    <g transform="translate(414, 224)">
      <circle cx="0" cy="0" r="34" fill="rgba(255,90,31,0.14)" stroke="#FF5A1F" stroke-width="3" stroke-dasharray="8 5" />
      <text x="0" y="5" text-anchor="middle" fill="#FF5A1F" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">R FIST</text>
    </g>
  </g>

  <!-- Top Instruction Pill -->
  <rect x="150" y="28" width="340" height="30" rx="15" fill="rgba(7,9,19,0.78)" stroke="#C8FF00" stroke-opacity="0.7" />
  <text x="320" y="48" text-anchor="middle" fill="#C8FF00" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="1.4">ALIGN SHOULDERS · HOLD GUARD 2s</text>
</svg>
