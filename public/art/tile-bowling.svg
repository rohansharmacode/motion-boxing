<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Bowling dashboard tile artwork">
  <defs>
    <linearGradient id="bw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A17" />
      <stop offset="60%" stop-color="#140E2C" />
      <stop offset="100%" stop-color="#1E0A22" />
    </linearGradient>
    <radialGradient id="bw-aura" cx="64%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FF2E88" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#22E5FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070A17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bw-lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1440" />
      <stop offset="100%" stop-color="#0E1838" />
    </linearGradient>
  </defs>
  <style>
    .ball { animation: bw-roll 3s ease-in infinite; }
    .pins { animation: bw-shake 3s ease-in-out infinite; transform-origin: 410px 150px; }
    @keyframes bw-roll { 0% { transform: translate(0, 0) scale(1); } 70%, 100% { transform: translate(150px, -170px) scale(0.45); opacity: 0.2; } }
    @keyframes bw-shake { 0%, 66% { transform: rotate(0); } 72% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } 90%, 100% { transform: rotate(0); } }
  </style>
  <rect width="640" height="400" fill="url(#bw-bg)" />
  <rect width="640" height="400" fill="url(#bw-aura)" />
  <!-- lane in perspective -->
  <polygon points="250,400 560,400 445,120 365,120" fill="url(#bw-lane)" />
  <line x1="250" y1="400" x2="365" y2="120" stroke="#22E5FF" stroke-width="4" />
  <line x1="560" y1="400" x2="445" y2="120" stroke="#22E5FF" stroke-width="4" />
  <line x1="220" y1="400" x2="352" y2="120" stroke="#FF2E88" stroke-width="3" opacity="0.8" />
  <line x1="590" y1="400" x2="458" y2="120" stroke="#FF2E88" stroke-width="3" opacity="0.8" />
  <g fill="#FF2E88">
    <polygon points="360,300 352,318 368,318" /><polygon points="405,296 397,314 413,314" /><polygon points="450,300 442,318 458,318" />
  </g>
  <!-- pins -->
  <g class="pins" fill="#F4F6FF" stroke="#22E5FF" stroke-width="1.5">
    <defs><g id="pin"><path d="M0 0c-4 0-5 5-4 9 1 3-4 7-4 14 0 6 3 10 8 10s8-4 8-10c0-7-5-11-4-14 1-4 0-9-4-9z" /><rect x="-3.5" y="9" width="7" height="2.5" fill="#FF2E88" stroke="none" /></g></defs>
    <use href="#pin" x="380" y="112" /><use href="#pin" x="400" y="112" /><use href="#pin" x="420" y="112" /><use href="#pin" x="440" y="112" />
    <use href="#pin" x="390" y="122" /><use href="#pin" x="410" y="122" /><use href="#pin" x="430" y="122" />
    <use href="#pin" x="400" y="132" /><use href="#pin" x="420" y="132" />
    <use href="#pin" x="410" y="142" />
  </g>
  <!-- ball -->
  <g class="ball">
    <circle cx="330" cy="350" r="34" fill="#1B2BFF" stroke="#22E5FF" stroke-width="4" />
    <circle cx="320" cy="338" r="4" fill="#070A17" /><circle cx="334" cy="334" r="4" fill="#070A17" /><circle cx="328" cy="350" r="4.5" fill="#070A17" />
  </g>
  <!-- speed lines -->
  <g stroke="#22E5FF" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="230" y1="340" x2="280" y2="330" /><line x1="220" y1="362" x2="282" y2="352" /><line x1="240" y1="384" x2="286" y2="374" />
  </g>
</svg>
