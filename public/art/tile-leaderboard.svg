<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Snowflake Leaderboard dashboard tile artwork">
  <defs>
    <linearGradient id="lb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1026" />
      <stop offset="55%" stop-color="#141334" />
      <stop offset="100%" stop-color="#091D34" />
    </linearGradient>
    <radialGradient id="lb-aura" cx="50%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#A98BFF" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#00F0FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#070913" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lb-p1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0B1632" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="lb-p2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A98BFF" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0E132B" stop-opacity="0.95" />
    </linearGradient>
    <filter id="lb-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    .crystal { animation: lb-spin 14s linear infinite; transform-origin: 320px 104px; }
    .bar1 { animation: lb-eq 2.6s ease-in-out infinite; transform-origin: 120px 330px; }
    .bar2 { animation: lb-eq 2.6s ease-in-out 0.4s infinite; transform-origin: 520px 330px; }
    .pulse-line { stroke-dasharray: 10 8; animation: lb-flow 1.4s linear infinite; }
    @keyframes lb-spin { to { transform: rotate(360deg); } }
    @keyframes lb-eq { 0%,100% { transform: scaleY(0.88); } 50% { transform: scaleY(1.08); } }
    @keyframes lb-flow { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: reduce) { .crystal, .bar1, .bar2, .pulse-line { animation: none; } }
  </style>

  <rect width="640" height="400" fill="url(#lb-bg)" />
  <rect width="640" height="400" fill="url(#lb-aura)" />

  <!-- Live Telemetry Waveform Background -->
  <polyline
    class="pulse-line"
    points="24,230 94,230 128,186 164,252 204,210 436,210 472,164 510,242 548,196 616,196"
    fill="none"
    stroke="#00F0FF"
    stroke-opacity="0.35"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Stylized Geometric Frost / Telemetry Crystal -->
  <g class="crystal" filter="url(#lb-glow)" stroke="#00F0FF" stroke-width="3.2" stroke-linecap="round">
    <line x1="320" y1="62" x2="320" y2="146" />
    <line x1="284" y1="83" x2="356" y2="125" />
    <line x1="356" y1="83" x2="284" y2="125" />
    <polygon points="320,86 336,95 336,113 320,122 304,113 304,95" fill="#0C1736" stroke="#C8FF00" stroke-width="2.5" />
    <circle cx="320" cy="62" r="4" fill="#FFFFFF" stroke="none" />
    <circle cx="320" cy="146" r="4" fill="#FFFFFF" stroke="none" />
    <circle cx="284" cy="83" r="4" fill="#A98BFF" stroke="none" />
    <circle cx="356" cy="125" r="4" fill="#A98BFF" stroke="none" />
    <circle cx="356" cy="83" r="4" fill="#A98BFF" stroke="none" />
    <circle cx="284" cy="125" r="4" fill="#A98BFF" stroke="none" />
  </g>

  <!-- Flanking Live Metric Bars -->
  <g class="bar1" fill="#A98BFF" fill-opacity="0.35">
    <rect x="64" y="256" width="16" height="74" rx="4" />
    <rect x="88" y="228" width="16" height="102" rx="4" fill="#00F0FF" fill-opacity="0.42" />
    <rect x="112" y="274" width="16" height="56" rx="4" />
  </g>
  <g class="bar2" fill="#00F0FF" fill-opacity="0.35">
    <rect x="512" y="264" width="16" height="66" rx="4" />
    <rect x="536" y="218" width="16" height="112" rx="4" fill="#C8FF00" fill-opacity="0.45" />
    <rect x="560" y="246" width="16" height="84" rx="4" fill="#A98BFF" fill-opacity="0.42" />
  </g>

  <!-- 3-Tier Neon Podium Silhouette -->
  <g filter="url(#lb-glow)">
    <!-- #2 Silver-Violet -->
    <rect x="158" y="226" width="102" height="108" rx="10" fill="url(#lb-p2)" stroke="#A98BFF" stroke-width="3" />
    <text x="209" y="284" text-anchor="middle" fill="#E2D4FF" font-family="'Chakra Petch', sans-serif" font-size="36" font-weight="700" font-style="italic">2</text>

    <!-- #1 Champion Cyan-Lime -->
    <rect x="268" y="176" width="104" height="158" rx="10" fill="url(#lb-p1)" stroke="#00F0FF" stroke-width="3.5" />
    <rect x="284" y="188" width="72" height="6" rx="3" fill="#C8FF00" />
    <text x="320" y="258" text-anchor="middle" fill="#FFFFFF" font-family="'Chakra Petch', sans-serif" font-size="48" font-weight="700" font-style="italic">1</text>

    <!-- #3 Magenta-Violet -->
    <rect x="380" y="254" width="102" height="80" rx="10" fill="url(#lb-p2)" stroke="#FF2A85" stroke-width="3" />
    <text x="431" y="305" text-anchor="middle" fill="#FF8AC0" font-family="'Chakra Petch', sans-serif" font-size="32" font-weight="700" font-style="italic">3</text>
  </g>

  <!-- Base Floor Line -->
  <line x1="126" y1="336" x2="514" y2="336" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />

  <!-- Bottom Edge Accent Strip -->
  <rect x="24" y="372" width="96" height="4" rx="2" fill="#A98BFF" />
  <rect x="128" y="372" width="54" height="4" rx="2" fill="#00F0FF" />
</svg>
