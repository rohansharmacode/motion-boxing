<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Kinetic Ring social preview card">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="55%" stop-color="#0F142C" />
      <stop offset="100%" stop-color="#1E0C24" />
    </linearGradient>
    <radialGradient id="og-c" cx="24%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#070913" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="og-m" cx="80%" cy="54%" r="46%">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#070913" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og-title" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00A6FF" />
    </linearGradient>
    <linearGradient id="og-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8FF00" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <filter id="og-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-grid)" />
  <rect width="1200" height="630" fill="url(#og-c)" />
  <rect width="1200" height="630" fill="url(#og-m)" />

  <!-- Outer Neon Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="url(#og-ring)" stroke-opacity="0.45" stroke-width="2" />

  <!-- Perspective Arena Lines (Right Half) -->
  <g stroke="#00F0FF" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="600" y1="252" x2="1178" y2="252" stroke="#FF2A85" stroke-opacity="0.4" stroke-width="3" />
    <line x1="600" y1="316" x2="1178" y2="316" stroke="#A47BFF" stroke-opacity="0.38" stroke-width="3" />
    <line x1="600" y1="380" x2="1178" y2="380" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="3" />
    <line x1="560" y1="470" x2="1178" y2="470" />
    <line x1="720" y1="430" x2="610" y2="610" />
    <line x1="890" y1="430" x2="900" y2="610" />
    <line x1="1040" y1="430" x2="1160" y2="610" />
  </g>

  <!-- LEFT HALF: Brand Identity & Value Prop -->
  <g transform="translate(68, 72)">
    <!-- Emblem + Kicker -->
    <g filter="url(#og-glow)">
      <polygon points="20,2 48,2 66,20 66,48 48,66 20,66 2,48 2,20" fill="#0C1022" stroke="url(#og-ring)" stroke-width="4" stroke-linejoin="round" />
      <polygon points="16,22 31,34 16,46 22,34" fill="#00F0FF" />
      <polygon points="52,22 37,34 52,46 46,34" fill="#FF2A85" />
      <polygon points="34,24 39,34 34,44 29,34" fill="#C8FF00" />
    </g>
    <rect x="86" y="16" width="290" height="34" rx="17" fill="rgba(200,255,0,0.14)" stroke="rgba(200,255,0,0.55)" />
    <text x="231" y="38" text-anchor="middle" fill="#C8FF00" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1.8">RETRO REMIX · KCL 2026</text>

    <!-- Display Wordmark -->
    <text x="0" y="182" fill="url(#og-title)" font-family="'Chakra Petch', sans-serif" font-size="96" font-weight="700" font-style="italic" letter-spacing="2" filter="url(#og-glow)">KINETIC</text>
    <text x="0" y="274" fill="#C8FF00" font-family="'Chakra Petch', sans-serif" font-size="96" font-weight="700" font-style="italic" letter-spacing="2" filter="url(#og-glow)">RING</text>

    <rect x="4" y="294" width="280" height="6" rx="3" fill="#00F0FF" />
    <rect x="294" y="294" width="136" height="6" rx="3" fill="#FF2A85" />

    <!-- Tagline -->
    <text x="2" y="346" fill="#F4F7FF" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="600">Browser motion sports. Only your webcam.</text>
    <text x="2" y="380" fill="#B6C2E2" font-family="'Space Grotesk', sans-serif" font-size="19">No controllers · No download · Video stays on-device</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 418)" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">
      <rect x="0" y="0" width="154" height="38" rx="19" fill="rgba(0,240,255,0.14)" stroke="#00F0FF" />
      <text x="77" y="24" text-anchor="middle" fill="#00F0FF">MEDIAPIPE POSE</text>

      <rect x="168" y="0" width="138" height="38" rx="19" fill="rgba(164,123,255,0.16)" stroke="#A47BFF" />
      <text x="237" y="24" text-anchor="middle" fill="#E2D4FF">THREE.JS 3D</text>

      <rect x="320" y="0" width="212" height="38" rx="19" fill="rgba(200,255,0,0.14)" stroke="#C8FF00" />
      <text x="426" y="24" text-anchor="middle" fill="#C8FF00">SNOWFLAKE CORTEX AI</text>
    </g>
  </g>

  <!-- RIGHT HALF: HEX-7 Visor-Drone vs Glowing Cyber Gloves -->
  <g transform="translate(650, 74)" filter="url(#og-glow)">
    <!-- Telegraph ring -->
    <circle cx="265" cy="194" r="134" fill="none" stroke="#FFB800" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="18 12" />
    <!-- Drone -->
    <rect x="136" y="178" width="32" height="58" rx="16" fill="#181F36" stroke="#A47BFF" stroke-width="3" />
    <rect x="362" y="178" width="32" height="58" rx="16" fill="#181F36" stroke="#A47BFF" stroke-width="3" />
    <polygon points="204,158 326,158 348,216 306,282 224,282 182,216" fill="#141A30" stroke="#A47BFF" stroke-width="4" stroke-linejoin="round" />
    <polygon points="265,192 288,220 265,248 242,220" fill="#E2D4FF" />
    <polygon points="244,288 286,288 265,336" fill="#00F0FF" fill-opacity="0.72" />
    <polygon points="218,86 312,86 330,122 308,148 222,148 200,122" fill="#181F36" stroke="#A47BFF" stroke-width="4" stroke-linejoin="round" />
    <path d="M 218 118 Q 265 138 312 118" fill="none" stroke="#FF2A85" stroke-width="12" stroke-linecap="round" />
    <path d="M 226 118 Q 265 133 304 118" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- Impact burst -->
    <polygon points="265,242 280,280 265,318 250,280" fill="#C8FF00" />
    <line x1="224" y1="280" x2="306" y2="280" stroke="#C8FF00" stroke-width="4" stroke-linecap="round" />

    <!-- Left Cyan Glove -->
    <g transform="translate(22, 272)">
      <polygon points="10,74 78,36 164,58 180,118 130,172 36,162 -4,118" fill="#12223C" stroke="#00F0FF" stroke-width="5" stroke-linejoin="round" />
      <rect x="78" y="64" width="68" height="16" rx="8" transform="rotate(14 112 72)" fill="#00F0FF" />
    </g>
    <!-- Right Ember-Magenta Glove -->
    <g transform="translate(332, 272)">
      <polygon points="166,74 98,36 12,58 -4,118 46,172 140,162 180,118" fill="#2A1228" stroke="#FF2A85" stroke-width="5" stroke-linejoin="round" />
      <rect x="30" y="64" width="68" height="16" rx="8" transform="rotate(-14 64 72)" fill="#FF5A1F" />
    </g>
  </g>
</svg>
