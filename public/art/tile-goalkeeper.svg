<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Goalkeeper dashboard tile artwork">
  <defs>
    <linearGradient id="gk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="55%" stop-color="#0B1E34" />
      <stop offset="100%" stop-color="#081C26" />
    </linearGradient>
    <radialGradient id="gk-glow-bg" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#3CF2B0" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#070913" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gk-frame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#C8FF00" />
      <stop offset="100%" stop-color="#3CF2B0" />
    </linearGradient>
    <filter id="gk-neon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    .ball { animation: gk-curve 3s ease-in-out infinite; transform-origin: 432px 154px; }
    .keeper { animation: gk-dive 3s ease-in-out infinite; transform-origin: 280px 240px; }
    .trail { stroke-dasharray: 12 10; animation: gk-dash 1.2s linear infinite; }
    @keyframes gk-curve { 0%,100% { transform: translate(-22px, 16px) scale(0.92); } 50% { transform: translate(12px, -10px) scale(1.06); } }
    @keyframes gk-dive { 0%,100% { transform: translate(0, 0) rotate(-3deg); } 50% { transform: translate(18px, -12px) rotate(4deg); } }
    @keyframes gk-dash { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .ball, .keeper, .trail { animation: none; } }
  </style>

  <rect width="640" height="400" fill="url(#gk-bg)" />
  <rect width="640" height="400" fill="url(#gk-glow-bg)" />

  <!-- Pitch Perspective Lines -->
  <g stroke="#3CF2B0" stroke-opacity="0.16" stroke-width="1.4">
    <line x1="0" y1="322" x2="640" y2="322" />
    <line x1="120" y1="322" x2="40" y2="400" />
    <line x1="520" y1="322" x2="600" y2="400" />
    <ellipse cx="320" cy="364" rx="180" ry="20" fill="none" />
  </g>

  <!-- Holographic 9-Zone Goal Net -->
  <g transform="translate(88, 70)">
    <!-- Net mesh -->
    <g stroke="#00F0FF" stroke-opacity="0.22" stroke-width="1.3">
      <line x1="40" y1="22" x2="424" y2="22" />
      <line x1="40" y1="84" x2="424" y2="84" />
      <line x1="40" y1="146" x2="424" y2="146" />
      <line x1="40" y1="208" x2="424" y2="208" />
      <line x1="136" y1="22" x2="136" y2="248" />
      <line x1="232" y1="22" x2="232" y2="248" />
      <line x1="328" y1="22" x2="328" y2="248" />
      <line x1="0" y1="0" x2="40" y2="22" />
      <line x1="464" y1="0" x2="424" y2="22" />
      <rect x="40" y="22" width="384" height="226" fill="none" />
    </g>
    <!-- Highlight top-right target zone -->
    <rect x="328" y="22" width="96" height="62" fill="#C8FF00" fill-opacity="0.1" stroke="#C8FF00" stroke-opacity="0.55" stroke-dasharray="6 4" />
    <!-- Neon Goal Frame -->
    <path d="M 0 252 L 0 0 L 464 0 L 464 252" fill="none" stroke="url(#gk-frame)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#gk-neon)" />
  </g>

  <!-- Curved Magnus Shot Trajectory -->
  <path class="trail" d="M 150 365 Q 290 220 434 150" fill="none" stroke="#C8FF00" stroke-width="3.5" stroke-linecap="round" />

  <!-- Diving Cyber-Keeper Silhouette (Geometric, non-Mii) -->
  <g class="keeper" filter="url(#gk-neon)">
    <!-- Reach arc -->
    <path d="M 164 252 Q 280 144 402 174" fill="none" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="8 8" />
    <!-- Geometric Torso Shield -->
    <polygon points="244,218 310,196 334,256 274,284" fill="#10203A" stroke="#00F0FF" stroke-width="3" stroke-linejoin="round" />
    <!-- Visor Head -->
    <polygon points="274,162 308,162 316,184 290,196 266,184" fill="#10203A" stroke="#3CF2B0" stroke-width="2.5" />
    <line x1="276" y1="178" x2="306" y2="176" stroke="#C8FF00" stroke-width="4" stroke-linecap="round" />
    <!-- Outstretched Left & Right Keeper Gloves -->
    <g transform="translate(174, 240) rotate(-18)">
      <rect x="-22" y="-18" width="44" height="36" rx="10" fill="#0B1E34" stroke="#00F0FF" stroke-width="3.5" />
      <rect x="-12" y="-10" width="24" height="8" rx="4" fill="#00F0FF" />
    </g>
    <g transform="translate(388, 174) rotate(18)">
      <rect x="-24" y="-20" width="48" height="40" rx="11" fill="#0E262B" stroke="#C8FF00" stroke-width="3.5" />
      <rect x="-14" y="-10" width="28" height="9" rx="4" fill="#C8FF00" />
    </g>
  </g>

  <!-- Plasma Football -->
  <g class="ball" filter="url(#gk-neon)">
    <circle cx="436" cy="148" r="24" fill="#0B162B" stroke="#C8FF00" stroke-width="4" />
    <polygon points="436,134 448,143 443,157 429,157 424,143" fill="#C8FF00" />
    <circle cx="436" cy="148" r="32" fill="none" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.8" stroke-dasharray="8 6" />
  </g>

  <!-- Bottom Edge Accent Strip -->
  <rect x="24" y="372" width="96" height="4" rx="2" fill="#3CF2B0" />
  <rect x="128" y="372" width="54" height="4" rx="2" fill="#00F0FF" />
</svg>
